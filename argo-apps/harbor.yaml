apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/matusbulla/argotest
    targetRevision: HEAD
    path: harbor
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor2