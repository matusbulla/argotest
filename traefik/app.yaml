apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.traefik.io/traefik
    chart: traefik
    targetRevision: "40.2.0"   # pin a version, check latest at https://artifacthub.io/packages/helm/traefik/traefik
    helm:
      values: |
        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`dashboard.localhost`)
            entryPoints:
              - web
        providers:
          kubernetesGateway:
            enabled: true
        gateway:
          listeners:
            web:
              namespacePolicy:
                from: All

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik          # will be created by ArgoCD if syncPolicy below is set

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true    # creates the traefik namespace automatically