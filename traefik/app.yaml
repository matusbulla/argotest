apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.traefik.io/traefik
    chart: traefik
    targetRevision: "40.2.0"   # pin a version, check latest at https://artifacthub.io/packages/helm/traefik/traefik
    helm:
      values: |
        deployment:
          replicas: 1

        service:
          type: LoadBalancer
        
        ports:
          traefik:
            expose:
              default: true

        # optional: enable dashboard
        ingressRoute:
          dashboard:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik          # will be created by ArgoCD if syncPolicy below is set

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true    # creates the traefik namespace automatically