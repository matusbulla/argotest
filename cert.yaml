apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-ca-cert
  namespace: cert-manager
spec:
  isCA: true
  commonName: harbor-internal-ca
  secretName: harbor-ca-tls
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: harbor-ca-issuer
spec:
  ca:
    secretName: harbor-ca-tls
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
